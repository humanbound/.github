name: Release

on:
  push:
    tags:
      # Single-package repos: tag `v<X.Y.Z>` (e.g. `v2.0.3`).
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Multi-package repos: tag `v-<pkg>-<X.Y.Z>` (e.g. `v-humanbound-test-0.1.0`).
      - "v-*-[0-9]+.[0-9]+.[0-9]+"

# Trusted Publishing (OIDC) needs id-token.
permissions:
  contents: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build job for Python packages.
  # Remove this job if the repo doesn't publish a Python wheel/sdist.
  # ───────────────────────────────────────────────────────────────────────────
  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    if: ${{ hashFiles('pyproject.toml') != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build-python
    if: ${{ needs.build-python.result == 'success' }}
    environment:
      name: pypi
      url: ${{ steps.publish.outputs.package-url }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - name: Publish
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # ───────────────────────────────────────────────────────────────────────────
  # GitHub Release — runs for every repo, regardless of language.
  # Body is generated from the CHANGELOG.md block matching the tag.
  # ───────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python]
    # Don't fail when build-python is skipped (non-Python repos).
    if: always() && (needs.build-python.result == 'success' || needs.build-python.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - name: Extract CHANGELOG section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip the leading "v" (and an optional "<pkg>-" prefix for multi-package repos).
          VERSION="${TAG#v}"
          VERSION="${VERSION#*-}"
          # Pull the section between this version's heading and the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" && $0 ~ ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION — using tag name as the release body."
            echo "Release $TAG" > release-notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download build artifacts (if any)
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
        continue-on-error: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
